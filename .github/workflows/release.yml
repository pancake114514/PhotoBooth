name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: npm run build:win
            artifact_glob: dist/photobooth-*-setup.exe
            artifact_name: win
          - os: macos-latest
            build_cmd: npm run build:mac
            artifact_glob: dist/photobooth-*-x64.dmg
            artifact_name: mac-x64
          - os: macos-latest
            build_cmd: npm run build:mac -- --arm64
            artifact_glob: dist/photobooth-*-arm64.dmg
            artifact_name: mac-arm64
          - os: ubuntu-latest
            build_cmd: npm run build:linux
            artifact_glob: dist/photobooth-*.AppImage
            artifact_name: linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Setup Xcode
        if: matrix.os == 'macos-latest'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build & Package
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: photobooth-${{ matrix.artifact_name }}-${{ github.run_id }}
          path: ${{ matrix.artifact_glob }}
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
